<!doctype html>
<html lang="fr" class="js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Prototype · Hero — Peachy</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/sections.css">
    <link rel="stylesheet" href="../../assets/css/motion.css">
    <style>
      /* ── Variante « Plein cadre » : la photo couvre tout l'écran (recadrage serré) ── */
      @media (min-width: 62rem) and (orientation: landscape) {
        .hero--plein .hero__media,
        .hero--plein .hero__voile {
          inset: 0;
          width: auto;
        }
        .hero--plein .hero__media img {
          object-position: 50% 44%;
        }
        .hero--plein .hero__voile {
          background:
            linear-gradient(100deg, rgb(29 16 10 / 0.9) 0%, rgb(29 16 10 / 0.66) 30%, rgb(29 16 10 / 0.12) 58%, rgb(29 16 10 / 0) 72%),
            linear-gradient(to bottom, rgb(29 16 10 / 0.55) 0%, rgb(29 16 10 / 0) 24%);
        }
      }

      /* ── Variante « Arche » : crème éditoriale, photo dans une arche ── */
      .hero--arche {
        color: var(--encre);
      }
      .hero--arche .hero__media {
        position: relative;
        inset: auto;
        z-index: 0;
        width: min(72%, 19rem);
        height: auto;
        aspect-ratio: 3 / 4;
        margin: 0 auto 2.5rem;
      }
      .hero--arche .chapo {
        color: var(--encre);
      }
      .hero--arche .filet {
        color: var(--terracotta);
        opacity: 0.8;
      }
      @media (min-width: 62rem) and (orientation: landscape) {
        .hero--arche .hero__media {
          position: absolute;
          top: 50%;
          right: max(var(--gouttiere), 9vw);
          width: min(30vw, 62svh);
          margin: 0;
          translate: 0 -46%;
        }
      }

      /* ── Sélecteur de variantes : chrome du prototype, repris tel quel de PICKER.md ── */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
      }

      .proto-picker-item {
        position: relative; /* sits above the highlight */
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition:
          color 150ms ease-out,
          transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (hover: hover) and (pointer: fine) {
        .proto-picker-item:hover {
          color: rgba(255, 255, 255, 0.85);
        }
      }

      .proto-picker-item:active {
        transform: scale(0.97);
      }

      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }

      .proto-picker-item[data-active] {
        color: #fff;
      }

      .proto-picker-divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.12);
      }

      .proto-picker-replay {
        padding: 0 10px;
        font-size: 14px;
      }

      .proto-picker[data-position="top"] {
        bottom: auto;
        top: 24px;
      }
    </style>
  </head>

  <body>
    <div id="stage"></div>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">Diptyque</button>
      <button class="proto-picker-item">Plein cadre</button>
      <button class="proto-picker-item">Arche</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
    </nav>

    <script>
      // Une fonction de rendu par variante, dans l'ordre du sélecteur.
      const variants = [

style=\"--i: 0\"><span class=\"ligne__texte\">L’art de prendre</span></span><span class=\"ligne\" style=\"--i: 1\"><span class=\"ligne__texte\">soin de soi</span></span></h1>\n  <hr class=\"filet\">\n  <p class=\"chapo\">Un lieu dédié au drainage lymphatique, où chaque séance devient un temps de calme, de chaleur et d’attention.</p>\n  <div class=\"hero__actions\"><a class=\"btn btn--ivoire\" href=\"../../index.html#rituels\">Découvrir nos soins <svg class=\"btn__fleche\" viewBox=\"0 0 18 10\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M0 5h16.5M12.5 1l4 4-4 4\" fill=\"none\" stroke=\"currentColor\"/></svg></a><a class=\"btn btn--contour\" href=\"../../index.html#reserver\">Réserver un soin</a></div>\n</div></section>",
        () => "<header class=\"entete\" data-tone=\"dark\"><div class=\"cadre entete__interieur\">\n  <a class=\"marque\" href=\"../../index.html\" aria-label=\"Peachy Lymphatic Therapy\"><span class=\"marque__nom\" aria-hidden=\"true\">Peachy</span><span class=\"marque__sous\" aria-hidden=\"true\">Lymphatic Therapy</span></a>\n  <nav class=\"nav\" aria-label=\"Navigation principale\"><ul class=\"nav__liste\"><li><a class=\"nav__lien\" href=\"../../index.html#rituels\">Les rituels</a></li><li><a class=\"nav__lien\" href=\"../../index.html#drainage\">Le drainage lymphatique</a></li><li><a class=\"nav__lien\" href=\"../../index.html#philosophie\">À propos</a></li><li><a class=\"nav__lien\" href=\"../../index.html#contact\">Contact</a></li></ul></nav>\n  <div class=\"entete__actions\"><a class=\"btn btn--contour btn--petit entete__reserver\" href=\"../../index.html#reserver\" aria-label=\"Réserver un soin\">Réserver<span class=\"entete__reserver-suite\">&nbsp;un soin</span></a></div>\n</div></header><section class=\"section hero hero--plein ton-sombre fond-chocolat\"><div class=\"hero__media\"><picture> <source type=\"image/avif\" srcset=\"../../assets/img/photos/hero-640.avif 640w, ../../assets/img/photos/hero-1125.avif 1125w, ../../assets/img/photos/hero-1528.avif 1528w\" sizes=\"(min-width: 62rem) and (orientation: landscape) min(52vw, 92vh), 100vw\"> <img src=\"../../assets/img/photos/hero-1528.webp\" srcset=\"../../assets/img/photos/hero-640.webp 640w, ../../assets/img/photos/hero-1125.webp 1125w, ../../assets/img/photos/hero-1528.webp 1528w\" sizes=\"(min-width: 62rem) and (orientation: landscape) min(52vw, 92vh), 100vw\" width=\"1528\" height=\"2044\" alt=\"Deux mains posées sur un dos huilé, pendant un soin chez Peachy\" decoding=\"async\"> </picture></div><div class=\"hero__voile\" aria-hidden=\"true\"></div><div class=\"cadre hero__contenu\">\n  <h1 class=\"titre-hero\"><span class=\"ligne\" style=\"--i: 0\"><span class=\"ligne__texte\">L’art de prendre</span></span><span class=\"ligne\" style=\"--i: 1\"><span class=\"ligne__texte\">soin de soi</span></span></h1>\n  <hr class=\"filet\">\n  <p class=\"chapo\">Un lieu dédié au drainage lymphatique, où chaque séance devient un temps de calme, de chaleur et d’attention.</p>\n  <div class=\"hero__actions\"><a class=\"btn btn--ivoire\" href=\"../../index.html#rituels\">Découvrir nos soins <svg class=\"btn__fleche\" viewBox=\"0 0 18 10\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M0 5h16.5M12.5 1l4 4-4 4\" fill=\"none\" stroke=\"currentColor\"/></svg></a><a class=\"btn btn--contour\" href=\"../../index.html#reserver\">Réserver un soin</a></div>\n</div></section>",
        () => "<header class=\"entete\" data-tone=\"light\"><div class=\"cadre entete__interieur\">\n  <a class=\"marque\" href=\"../../index.html\" aria-label=\"Peachy Lymphatic Therapy\"><span class=\"marque__nom\" aria-hidden=\"true\">Peachy</span><span class=\"marque__sous\" aria-hidden=\"true\">Lymphatic Therapy</span></a>\n  <nav class=\"nav\" aria-label=\"Navigation principale\"><ul class=\"nav__liste\"><li><a class=\"nav__lien\" href=\"../../index.html#rituels\">Les rituels</a></li><li><a class=\"nav__lien\" href=\"../../index.html#drainage\">Le drainage lymphatique</a></li><li><a class=\"nav__lien\" href=\"../../index.html#philosophie\">À propos</a></li><li><a class=\"nav__lien\" href=\"../../index.html#contact\">Contact</a></li></ul></nav>\n  <div class=\"entete__actions\"><a class=\"btn btn--contour btn--petit entete__reserver\" href=\"../../index.html#reserver\" aria-label=\"Réserver un soin\">Réserver<span class=\"entete__reserver-suite\">&nbsp;un soin</span></a></div>\n</div></header><section class=\"section hero hero--arche fond-ivoire\"><div class=\"ombre-vegetale\" aria-hidden=\"true\"></div><div class=\"hero__media photo photo--arche photo--ombre\"><picture> <source type=\"image/avif\" srcset=\"../../assets/img/photos/hero-640.avif 640w, ../../assets/img/photos/hero-1125.avif 1125w, ../../assets/img/photos/hero-1528.avif 1528w\" sizes=\"(min-width: 62rem) and (orientation: landscape) min(52vw, 92vh), 100vw\"> <img src=\"../../assets/img/photos/hero-1528.webp\" srcset=\"../../assets/img/photos/hero-640.webp 640w, ../../assets/img/photos/hero-1125.webp 1125w, ../../assets/img/photos/hero-1528.webp 1528w\" sizes=\"(min-width: 62rem) and (orientation: landscape) min(52vw, 92vh), 100vw\" width=\"1528\" height=\"2044\" alt=\"Deux mains posées sur un dos huilé, pendant un soin chez Peachy\" decoding=\"async\"> </picture></div><div class=\"cadre hero__contenu\">\n  <h1 class=\"titre-hero\"><span class=\"ligne\" style=\"--i: 0\"><span class=\"ligne__texte\">L’art de prendre</span></span><span class=\"ligne\" style=\"--i: 1\"><span class=\"ligne__texte\">soin de soi</span></span></h1>\n  <hr class=\"filet\">\n  <p class=\"chapo\">Un lieu dédié au drainage lymphatique, où chaque séance devient un temps de calme, de chaleur et d’attention.</p>\n  <div class=\"hero__actions\"><a class=\"btn btn--chocolat\" href=\"../../index.html#rituels\">Découvrir nos soins <svg class=\"btn__fleche\" viewBox=\"0 0 18 10\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M0 5h16.5M12.5 1l4 4-4 4\" fill=\"none\" stroke=\"currentColor\"/></svg></a><a class=\"btn btn--contour\" href=\"../../index.html#reserver\">Réserver un soin</a></div>\n</div></section>"
      ];

      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        // Clear first, render next frame, so entrance animations re-run.
        requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
      setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
      // Enable the slide only after first paint, so load doesn't animate.
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    </script>
  </body>
